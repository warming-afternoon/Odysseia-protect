[project]
name = "odysseia-protect"
version = "0.1.0"
description = "A Discord bot for advanced file management."
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9.0",
    "SQLAlchemy>=2.0.0",
    "aiosqlite>=0.19.0",
    "discord.py[speed]>=2.7.1",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.4",
    "regex>=2024.0.0",
    "alembic>=1.13.0",
    'uvloop>=0.19.0; sys_platform != "win32"',
    "aioboto3>=13.0.0",
    "cryptography>=45.0.0",
    "redis[hiredis]>=5.2.0",
    "py7zr>=1.0.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]
watermark-experiment = ["pillow>=11.0.0"]

[tool.uv]
# This section can be used for uv-specific configurations if needed in the future.
